[tools]
go = "1.24.3"

[tasks.install]
run = "go mod download"
depends = ["install:*"]

[tasks."install:dummy"]
hide = true
run = "true"

[tasks.lint]
run = "if command -v workspaced >/dev/null; then workspaced codebase lint; else echo 'workspaced missing, skipping lint'; fi"

[tasks.fmt]
run = "if command -v workspaced >/dev/null; then workspaced codebase format; else echo 'workspaced missing, skipping format'; fi"

[tasks.test]
run = "go test ./..."
depends = ["test:*"]

[tasks."test:dummy"]
hide = true
run = "true"

[tasks.codegen]
run = "go generate ./..."
depends = ["codegen:*"]

[tasks."codegen:dummy"]
hide = true
run = "true"

[tasks.build]
run = "mkdir -p dist && go build -o dist/notify ./cli/notify"

[tasks.check]
depends = ["lint", "test"]

[tasks.ci]
depends = ["check"]
