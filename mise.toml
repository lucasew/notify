[tools]
"github:lucasew/workspaced" = "0.2.2"
golang = "1.21.0"

[tasks."ci:test"]
run = '''
#!/usr/bin/env bash
if [ -f go.mod ]; then
    go test ./...
else
    echo "go.mod not found, skipping tests"
fi
'''

[tasks."ci:build"]
run = '''
#!/usr/bin/env bash
if [ -f go.mod ]; then
    go build ./...
else
    echo "go.mod not found, skipping build"
fi
'''

[tasks."ci"]
depends = ["ci:*"]
