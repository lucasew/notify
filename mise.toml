[tools]
go = "1.21.3"
"github:lucasew/workspaced" = "v0.2.1"

[tasks]
lint = "workspaced codebase lint"
fmt = "workspaced codebase format"

[tasks.test]
depends = ["test:*"]

[tasks."test:go"]
run = "go test -v ./..."

[tasks.codegen]
depends = ["codegen:*"]

[tasks."codegen:go"]
run = "go generate ./..."

[tasks.install]
depends = ["install:*"]

[tasks."install:go"]
run = "[ -f go.mod ] && go mod download || echo 'No go.mod found, skipping download'"

[tasks.ci]
depends = ["lint", "test"]
